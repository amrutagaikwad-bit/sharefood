# Netlify config — repo root is sharefood/
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_API_URL = "https://foodbridge-54z7.onrender.com/api"
  VITE_SOCKET_URL = "https://foodbridge-54z7.onrender.com"

# SPA — all React Router paths must serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
