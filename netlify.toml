# Use this when Netlify base directory is the repo root (sharefood/)
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_API_URL = "https://foodbridge-54z7.onrender.com/api"
  VITE_SOCKET_URL = "https://foodbridge-54z7.onrender.com"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
