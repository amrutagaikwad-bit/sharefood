services:
  - type: web
    name: foodbridge-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    healthCheckPath: /api/health/public
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: postgresql://postgres:FoodBridge%401012@db.tpnhbwflsrscfylnedqp.supabase.co:6543/postgres?pgbouncer=true&sslmode=require
      - key: DIRECT_URL
        value: postgresql://postgres:FoodBridge%401012@db.tpnhbwflsrscfylnedqp.supabase.co:6543/postgres?pgbouncer=true&sslmode=require
      - key: JWT_SECRET
        value: foodbridge_prod_jwt_secret_min_32_chars
      - key: FRONTEND_URL
        value: https://foodbridgeplatform.netlify.app
      - key: PORT
        value: 10000
