services:
  - type: web
    name: foodbridge-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss && npm run seed
    startCommand: npm start
    healthCheckPath: /api/health/public
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://foodbridgeplatform.netlify.app
      - key: PORT
        value: 10000
