services:
  - type: web
    name: foodbridge-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss
    startCommand: npm start
    healthCheckPath: /api/health/public
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        value: foodbridge_prod_jwt_secret_min_32_chars
      - key: FRONTEND_URL
        value: https://foodbridgeplatform.netlify.app
